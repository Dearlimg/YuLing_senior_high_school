# yulin-secret 模板 —— 这是**模板**，不是可直接 apply 的清单。
#
# 为什么仓库里不放真值：
#   Secret 提交进 Git 之后，即使后续删除，历史提交里依然是明文，
#   任何能 clone 仓库的人（包括 CI runner、协作者、泄露的备份）都能读到。
#   这是最高频的凭据泄露路径之一。
#
# 正确做法（三选一，推荐第一种）：
#   1) 命令行直接创建，不落地文件：
#        kubectl create secret generic yulin-secret -n apps \
#          --from-literal=MYSQL_PASSWORD='***' \
#          --from-literal=REDIS_PASSWORD='***' \
#          --dry-run=client -o yaml | kubectl apply -f -
#   2) 本地填好 secret.yaml（已在 .gitignore 中）后 apply
#   3) 生产环境接 External Secrets Operator / Sealed Secrets / Vault
#
# 校验是否真的没进仓库：
#   git log --all -- deploy/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: yulin-secret
  namespace: apps
  labels:
    app: yulin-server
    app.kubernetes.io/part-of: yulin
type: Opaque
stringData:
  # 对应 infra/mysql 中专用账号 yulin 的密码。
  # 刻意不用 root：应用只需要自己库的权限，root 一旦泄露是整实例沦陷。
  MYSQL_PASSWORD: "REPLACE_WITH_REAL_PASSWORD"
  # 共享 Redis 实例的访问密码（与 infra-secret 中的 REDIS_PASSWORD 一致）。
  # 注意：共享实例无法做到"每应用独立口令"，
  # 隔离只能靠库号（REDIS_DB）+ 键前缀（REDIS_KEY_PREFIX）实现。
  REDIS_PASSWORD: "REPLACE_WITH_REAL_PASSWORD"
  # 如需管理接口，填入至少 32 字符随机 Token；留空表示关闭管理功能。
  ADMIN_TOKEN: ""
