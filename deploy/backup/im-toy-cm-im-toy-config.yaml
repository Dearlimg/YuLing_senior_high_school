apiVersion: v1
data:
  config.yaml: |
    server:
      port: 8080
      mode: release

    database:
      host: mysql.infra.svc.cluster.local
      port: 3306
      username: root
      password: ""
      database: im_chat
      charset: utf8mb4
      max_idle_conns: 10
      max_open_conns: 100

    redis:
      host: redis.infra.svc.cluster.local
      port: 6379
      password: ""
      db: 0
      pool_size: 10

    kafka:
      brokers:
        - "kafka.infra.svc.cluster.local:9092"
      topic: "im_message"
      topics:
        group_msg_raw: "group-msg-raw"
        group_msg_publish: "group-msg-publish"
        private_msg: "private-msg"
        read_events: "read-events"

    jwt:
      secret_key: ""
      expire: 1800
      refresh: 604800
kind: ConfigMap
